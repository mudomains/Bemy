<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#ff4b6e" />
    <title>Be My Valentine ❤️</title>

    <!-- Google Analytics 4 -->
    <!-- Replace G-XXXXXXXXXX with your Measurement ID -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);} 
        gtag('js', new Date());
        gtag('config', 'G-XXXXXXXXXX');
    </script>

    <!-- Soft Background Music -->
    <audio id="bgMusic" loop preload="auto">
        <source src="romantic-music.mp3" type="audio/mpeg">
        <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3?filename=romantic-love-ambient-11071.mp3" type="audio/mpeg">
    </audio>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 15px;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: background 1s ease;
        }

        .container {
            background: rgba(255,255,255,0.95);
            padding: clamp(20px, 4vw, 40px);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-width: 520px;
            width: 100%;
            position: relative;
            z-index: 5;
        }

        h1 {
            margin-bottom: 30px;
            font-size: clamp(22px, 5vw, 34px);
            line-height: 1.3;
        }

        .buttons {
            position: relative;
            height: 140px;
            width: 100%;
        }

        button {
            padding: clamp(12px, 3vw, 18px) clamp(22px, 4vw, 30px);
            border: none;
            border-radius: 50px;
            font-size: clamp(16px, 3.5vw, 18px);
            cursor: pointer;
            position: absolute;
            transition: all 0.25s ease;
            touch-action: manipulation;
        }

        #yesBtn { background: #4caf50; color: white; left: 20%; top: 40px; }
        #noBtn { background: #f44336; color: white; left: 60%; top: 40px; }

        #finalMessage {
            display: none;
            font-size: clamp(18px, 4vw, 22px);
            margin-top: 20px;
            line-height: 1.4;
        }

        #shareBtn {
            display: none;
            margin-top: 20px;
            background: #25D366;
            color: white;
            position: relative;
            left: 0;
            width: 100%;
            max-width: 260px;
        }

        #musicToggle {
            position: fixed;
            bottom: 18px;
            right: 18px;
            padding: 12px 18px;
            border-radius: 40px;
            border: none;
            background: rgba(0,0,0,0.75);
            color: white;
            cursor: pointer;
            z-index: 10;
            backdrop-filter: blur(6px);
        }

        .heart {
            position: fixed;
            width: 32px;
            height: 32px;
            background: red;
            transform: rotate(45deg);
            animation: float 10s linear infinite;
            z-index: 1;
            opacity: 0.9;
        }

        .heart::before,
        .heart::after {
            content: "";
            position: absolute;
            width: 32px;
            height: 32px;
            background: red;
            border-radius: 50%;
        }

        .heart::before { top: -16px; left: 0; }
        .heart::after { left: -16px; top: 0; }

        @keyframes float {
            from { transform: translateY(110vh) rotate(45deg); }
            to { transform: translateY(-120px) rotate(45deg); }
        }

        @media (max-width: 420px) {
            #yesBtn { left: 10%; }
            #noBtn { left: 55%; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1 id="questionText"></h1>
    
    <div class="buttons">
        <button id="yesBtn">Yes</button>
        <button id="noBtn">No</button>
    </div>

    <div id="finalMessage"></div>

    <div style="display:flex; justify-content:center;">
        <button id="shareBtn">Share on WhatsApp</button>
    </div>
</div>

<button id="musicToggle">🔊 Music</button>

<script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const finalMsg = document.getElementById('finalMessage');
    const questionText = document.getElementById('questionText');
    const shareBtn = document.getElementById('shareBtn');
    const music = document.getElementById('bgMusic');
    const musicToggle = document.getElementById('musicToggle');

    const pages = [
        { name: "Bophelo", color: "linear-gradient(135deg,#ff9a9e,#fad0c4)", accent: "#e91e63", message: "I knew you would say yes Bophelo 💖 Can't wait to see you!" },
        { name: "Gijon", color: "linear-gradient(135deg,#ff416c,#ff4b2b)", accent: "#ff1744", message: "Gijon, you just made me the happiest ❤️ See you soon!" },
        { name: "Nipho", color: "linear-gradient(135deg,#a18cd1,#fbc2eb)", accent: "#9c27b0", message: "Nipho 💜 I knew you'd say yes! Counting the minutes to see you." }
    ];

    let pageIndex = 0;

    if (window.location.hash) {
        const name = window.location.hash.replace('#', '');
        const index = pages.findIndex(p => p.name.toLowerCase() === name.toLowerCase());
        if (index !== -1) pageIndex = index;
    }

    function loadPage() {
        const page = pages[pageIndex];
        document.body.style.background = page.color;
        questionText.innerText = `Will you be my Valentine, ${page.name}? ❤️`;
        questionText.style.color = page.accent;
        finalMsg.style.color = page.accent;
    }

    loadPage();

    function startMusic() {
        music.play().catch(()=>{});
        document.removeEventListener('touchstart', startMusic);
        document.removeEventListener('click', startMusic);
    }

    document.addEventListener('touchstart', startMusic, { once:true });
    document.addEventListener('click', startMusic, { once:true });

    musicToggle.addEventListener('click', () => {
        if (music.paused) {
            music.play();
            musicToggle.innerText = "🔊 Music";
        } else {
            music.pause();
            musicToggle.innerText = "🔇 Muted";
        }
    });

    function moveNoButton() {
        const container = document.querySelector('.buttons');
        const maxX = container.clientWidth - noBtn.clientWidth;
        const maxY = container.clientHeight - noBtn.clientHeight;

        const randomX = Math.random() * maxX;
        const randomY = Math.random() * maxY;

        noBtn.style.left = randomX + 'px';
        noBtn.style.top = randomY + 'px';

        const phrases = ["Are you sure?","Really sure?","Think again ❤️","Don't break my heart 😢"];
        noBtn.innerText = phrases[Math.floor(Math.random() * phrases.length)];
    }

    noBtn.addEventListener('mouseover', moveNoButton);
    noBtn.addEventListener('touchstart', moveNoButton);

    yesBtn.addEventListener('click', () => {
        const page = pages[pageIndex];
        if (navigator.vibrate) navigator.vibrate([200,100,200]);

        finalMsg.style.display = 'block';
        document.querySelector('.buttons').style.display = 'none';
        shareBtn.style.display = 'inline-block';

        questionText.innerText = `Yay ${page.name}! ❤️`;
        finalMsg.innerText = page.message;

        if (typeof gtag !== 'undefined') {
            gtag('event', 'valentine_yes_clicked', { name: page.name });
        }
    });

    shareBtn.addEventListener('click', () => {
        const page = pages[pageIndex];
        const msg = `Hey ${page.name}, will you be my Valentine? ❤️`;
        const url = `https://wa.me/?text=${encodeURIComponent(msg)}`;
        window.open(url, '_blank');

        if (typeof gtag !== 'undefined') {
            gtag('event', 'whatsapp_share_clicked', { name: page.name });
        }
    });

    function createHeart() {
        const heart = document.createElement('div');
        heart.classList.add('heart');
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.animationDuration = (Math.random() * 5 + 5) + 's';
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 10000);
    }

    setInterval(createHeart, 900);
</script>

</body>
</html>
